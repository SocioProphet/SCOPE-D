name: OSINT Enrichment Run

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Enrichment tier (1=signal, 2=hubs, 3=all)'
        required: false
        default: '1'
      limit:
        description: 'Max accounts to enrich per run'
        required: false
        default: '50'
      fixture_mode:
        description: 'Fixture mode (true = no live network contact)'
        required: false
        default: 'true'
  schedule:
    # Weekly enrichment of tier-1 (security_signal) accounts — Sunday 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-whois

      - name: Run enrichment (fixture mode in CI — no live contact without explicit dispatch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          NUMVERIFY_API_KEY: ${{ secrets.NUMVERIFY_API_KEY }}
        run: |
          FIXTURE_FLAG=""
          if [ "${{ github.event.inputs.fixture_mode }}" != "false" ]; then
            FIXTURE_FLAG="--fixture"
          fi
          python intel/enrichment/enrich_sg_corpus.py \
            --policy "engagement-policy-sg-research-ci" \
            --auth "SG threat network mapping: public profiles only (CI run)" \
            --scope public_research_no_pii \
            --operator "ci@socioprophet.ai" \
            --tier ${{ github.event.inputs.tier || '1' }} \
            --limit ${{ github.event.inputs.limit || '50' }} \
            --concurrency 4 \
            $FIXTURE_FLAG \
            --json

      - name: Upload enrichment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osint-enrichment-${{ github.run_number }}
          path: raw/
          retention-days: 30
