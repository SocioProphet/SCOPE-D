name: SCOPE-D Contract Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate SCOPE-D contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate contracts and smoke tests
        run: npm test

      - name: Smoke test collector policy fail-closed contracts explicitly
        run: npm run test:collector-policy

      - name: Regenerate reference work orders
        run: npm run references:workorders

      - name: Ensure reference work orders are current
        run: git diff --exit-code references/work-orders.md

      - name: Smoke test standalone synthetic event generator
        run: npm run synthetic:event -- examples/scope-d/atomic-testcase.example.json runs/ci-standalone/events.jsonl

      - name: Verify standalone synthetic event exists
        run: test -f runs/ci-standalone/events.jsonl

      - name: Smoke test safe run initializer
        run: npm run scope-d:init -- --run-id scope-d-ci-synthetic-lab --target ci-synthetic-lab --engagement-policy examples/scope-d/engagement-policy.synthetic.json

      - name: Verify generated receipt exists
        run: test -f runs/scope-d-ci-synthetic-lab/receipt.json

      - name: Verify generated run integrity
        run: npm run scope-d:verify-run -- runs/scope-d-ci-synthetic-lab

      - name: Report verified generated run
        run: npm run scope-d:report-run -- runs/scope-d-ci-synthetic-lab

      - name: Verify generated summary exists
        run: test -f runs/scope-d-ci-synthetic-lab/run-summary.json && test -f runs/scope-d-ci-synthetic-lab/run-summary.md

      - name: Export verified run dashboard summary
        run: npm run scope-d:export-dashboard -- runs/scope-d-ci-synthetic-lab

      - name: Verify dashboard export exists
        run: test -f runs/scope-d-ci-synthetic-lab/dashboard-summary.json

      - name: Export verified run to Ontogenesis RDF
        run: npm run scope-d:export-ontogenesis -- runs/scope-d-ci-synthetic-lab

      - name: Verify Ontogenesis RDF export exists
        run: test -f runs/scope-d-ci-synthetic-lab/ontogenesis.ttl

      - name: Smoke test AI-infra vertical slice explicitly
        run: npm run scope-d:init-ai-infra -- --run-id scope-d-ci-ai-infra-lab-explicit --target ci-ai-infra-lab --engagement-policy examples/scope-d/engagement-policy.synthetic.json

      - name: Verify AI-infra generated run integrity
        run: npm run scope-d:verify-run -- runs/scope-d-ci-ai-infra-lab-explicit

      - name: Report AI-infra generated run
        run: npm run scope-d:report-run -- runs/scope-d-ci-ai-infra-lab-explicit

      - name: Export AI-infra dashboard summary
        run: npm run scope-d:export-dashboard -- runs/scope-d-ci-ai-infra-lab-explicit

      - name: Export AI-infra run to Ontogenesis RDF
        run: npm run scope-d:export-ontogenesis -- runs/scope-d-ci-ai-infra-lab-explicit

      - name: Smoke test graph robustness vertical slice explicitly
        run: npm run scope-d:init-graph-robustness -- --run-id scope-d-ci-graph-robustness-lab-explicit --target ci-graph-robustness-lab --engagement-policy examples/scope-d/engagement-policy.synthetic.json

      - name: Verify graph robustness generated run integrity
        run: npm run scope-d:verify-run -- runs/scope-d-ci-graph-robustness-lab-explicit

      - name: Report graph robustness generated run
        run: npm run scope-d:report-run -- runs/scope-d-ci-graph-robustness-lab-explicit

      - name: Export graph robustness dashboard summary
        run: npm run scope-d:export-dashboard -- runs/scope-d-ci-graph-robustness-lab-explicit

      - name: Export graph robustness run to Ontogenesis RDF
        run: npm run scope-d:export-ontogenesis -- runs/scope-d-ci-graph-robustness-lab-explicit

      - name: Generate 23-topic LSA map report
        run: npm run scope-d:report-lsa-map

      - name: Verify LSA map report exists
        run: test -f reports/scope-d-lsa-map-report.json && test -f reports/scope-d-lsa-map-report.md

      - name: Prove tamper detection rejects modified artifacts
        run: npm run test:tamper
