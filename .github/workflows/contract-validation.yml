name: SCOPE-D Contract Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate SCOPE-D contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate contracts
        run: npm test

      - name: Smoke test safe run initializer
        run: npm run scope-d:init -- --run-id scope-d-ci-synthetic-lab --target ci-synthetic-lab

      - name: Verify generated receipt exists
        run: test -f runs/scope-d-ci-synthetic-lab/receipt.json
